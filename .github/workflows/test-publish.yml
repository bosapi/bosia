name: Test & Publish

# Tests + a scaffold/build/start smoke run on Linux and Windows, on every
# push / PR. A push to main whose packages/bosia/package.json version isn't on
# npm yet also publishes, only after every test job is green on both OSes:
#
#   test ─┬─ smoke ─────┐
#         └─ dev-smoke ─┤
#   decide ─────────────┴─ build-templates ── publish-npm ── release
#
# Publish = build templates, npm publish, then the GitHub Release with the
# prebuilt artifacts. `decide` skips versions npm already has, so a bump
# blocked by failing tests publishes on the next green push to main.

# Docs-only changes skip this workflow — docs.yml builds and deploys those.
# A push that mixes docs and code still runs (paths-ignore needs every file
# to match).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # same Bun as local; bun.lock is tied to it

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check + format check
        working-directory: packages/bosia
        run: bun run check

      - name: Test
        working-directory: packages/bosia
        run: bun test

  smoke:
    name: smoke (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash # Git Bash on windows-latest — one script for both OSes
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # same Bun as local; bun.lock is tied to it

      - name: Install
        run: bun install --frozen-lockfile

      # Outside the repo so the monorepo workspace globs don't pick it up.
      - name: Scaffold app from local template
        working-directory: ..
        run: bun "$GITHUB_WORKSPACE/packages/bosia/src/cli/index.ts" create smoke --template default --local

      - name: Build
        working-directory: ../smoke
        run: bun run build

      - name: Start and probe
        working-directory: ../smoke
        run: |
          PORT=4817 bun run start > start.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4817/_health > /dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null -w "/_health %{http_code}\n" http://127.0.0.1:4817/_health
          curl -sf -o /dev/null -w "/ %{http_code}\n" http://127.0.0.1:4817/
          # Every client asset listed in the manifest must be served (catches "\" in URLs).
          for f in $(bun -e 'const m = await Bun.file("dist/manifest.json").json(); console.log([...m.js, ...m.css].join("\n"))'); do
            curl -sf -o /dev/null "http://127.0.0.1:4817/dist/client/$f" || { echo "missing asset: $f"; exit 1; }
          done
          echo "all manifest assets served"

      - name: Server log
        if: always()
        working-directory: ../smoke
        run: cat start.log 2>/dev/null || true

  # `bun run dev`: serve, pick up an edit and a new route without restarting,
  # then survive a hard kill + restart. Steps live in .github/scripts/dev-smoke.sh.
  dev-smoke:
    name: dev-smoke (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # same Bun as local; bun.lock is tied to it

      - name: Install
        run: bun install --frozen-lockfile

      - name: Scaffold app from local template
        working-directory: ..
        run: bun "$GITHUB_WORKSPACE/packages/bosia/src/cli/index.ts" create devsmoke --template default --local

      - name: Dev server smoke
        working-directory: ../devsmoke
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dev-smoke.sh" "$GITHUB_WORKSPACE/packages/bosia"

  # ── Publish: push to main or "Run workflow", when npm lacks the version ──
  decide:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what to do
        id: decide
        run: |
          VERSION=$(jq -r '.version' packages/bosia/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Publish whenever npm lacks this version, not only when this push
          # changed package.json: a bump whose run failed then ships with the
          # next green push. Only a real 404 counts — an npm outage skips.
          if OUT=$(npm view "bosia@$VERSION" version 2>&1); then
            [ -n "$OUT" ] && PUBLISH=false || PUBLISH=true
          elif grep -q E404 <<<"$OUT"; then
            PUBLISH=true
          else
            echo "::warning::npm view failed, skipping publish: $OUT"
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          # Prerelease → next, stable → latest.
          if [[ "$VERSION" =~ -(rc|beta|alpha) ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build-templates:
    needs: [decide, test, smoke, dev-smoke]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # same Bun as local; bun.lock is tied to it

      - name: Build prebuilt template artifacts
        run: bun run build:templates
        working-directory: packages/bosia

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt
          path: packages/bosia/dist/prebuilt/*.tar.gz
          if-no-files-found: error

  publish-npm:
    needs: [decide, build-templates]
    runs-on: ubuntu-latest
    # Queue, never cancel, a publish already in progress.
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        run: |
          echo "Publishing bosia@${{ needs.decide.outputs.version }} with tag ${{ needs.decide.outputs.tag }}"
          npm publish --tag "${{ needs.decide.outputs.tag }}" --access public
        working-directory: packages/bosia

  release:
    needs: [decide, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # gh release create needs the repo context

      - uses: actions/download-artifact@v8
        with:
          name: prebuilt
          path: prebuilt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.decide.outputs.version }}"
          ASSETS=(prebuilt/*.tar.gz)
          if [ "${{ needs.decide.outputs.tag }}" = "next" ]; then
            gh release create "$VERSION" --title "$VERSION" --generate-notes --prerelease "${ASSETS[@]}"
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes "${ASSETS[@]}"
          fi
