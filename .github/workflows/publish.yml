name: Publish & prebuilt templates

# One workflow, two outcomes — decided by whether the version in
# packages/bosia/package.json is already on npm:
#
#   • not on npm yet (version bump) → build templates, npm publish,
#     create the GitHub Release and upload the prebuilt artifacts.
#   • already on npm                → build templates and re-upload
#     (--clobber) onto the EXISTING release. Never touches npm, so the
#     "version already exists" error can't happen.
#
# Asking npm (not git diff) means a publish blocked by failing tests is retried
# by the next run — a fix push or "Run workflow" — without another bump.
#
# Job graph:
#
#   decide ─────────────────────────┐
#   test (ci.yml: linux + windows) ─┴─ build-templates ─┬─ publish-npm ── release
#                                                       └─ refresh-assets
#
# Nothing is published unless tests pass on both OSes. build:templates runs
# exactly once per push; its tarballs travel between jobs as the "prebuilt"
# artifact.

on:
  push:
    branches: [main]
    paths:
      - "packages/bosia/package.json"
      - "registry/**"
      - "packages/bosia/templates/**"
      - ".github/workflows/publish.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# Serialize runs of this workflow so two pushes landing close together never
# create/clobber the same release assets concurrently.
# cancel-in-progress: false = queue, never cancel a publish in progress.
concurrency:
  group: prebuilt-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      published: ${{ steps.decide.outputs.published }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to do
        id: decide
        run: |
          VERSION=$(jq -r '.version' packages/bosia/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Publish only a version npm doesn't have yet.
          if npm view "bosia@$VERSION" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

          # Prerelease → next, stable → latest.
          if [[ "$VERSION" =~ -(rc|beta|alpha) ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

  test:
    uses: ./.github/workflows/ci.yml

  build-templates:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # same Bun as local; bun.lock is tied to it

      - name: Build prebuilt template artifacts
        run: bun run build:templates
        working-directory: packages/bosia

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: packages/bosia/dist/prebuilt/*.tar.gz
          if-no-files-found: error

  # ── Publish path: version not on npm yet ──
  publish-npm:
    needs: [decide, build-templates]
    if: needs.decide.outputs.published == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        run: |
          echo "Publishing bosia@${{ needs.decide.outputs.version }} with tag ${{ needs.decide.outputs.tag }}"
          npm publish --tag "${{ needs.decide.outputs.tag }}" --access public
        working-directory: packages/bosia

  release:
    needs: [decide, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # gh release create needs the repo context

      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.decide.outputs.version }}"
          ASSETS=(prebuilt/*.tar.gz)
          if [ "${{ needs.decide.outputs.tag }}" = "next" ]; then
            gh release create "$VERSION" --title "$VERSION" --generate-notes --prerelease "${ASSETS[@]}"
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes "${ASSETS[@]}"
          fi

  # ── Refresh path: version already on npm (registry/template change) ──
  refresh-assets:
    needs: [decide, build-templates]
    if: needs.decide.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: prebuilt
          path: prebuilt

      - name: Refresh release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.decide.outputs.version }}"
          # The release is created by the publish path on version bump. If the
          # current version isn't released yet, there's nothing to clobber.
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION not published yet — nothing to refresh."
            exit 0
          fi
          gh release upload "$VERSION" prebuilt/*.tar.gz --clobber
