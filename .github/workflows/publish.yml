name: Publish & prebuilt templates

# Runs when packages/bosia/package.json changes on main. Publishes only a
# version npm doesn't have yet: build templates, npm publish, then create the
# GitHub Release with the prebuilt artifacts.
#
# Tests aren't run here — `wait-tests` waits for test.yml's run on the same
# commit and stops the publish if it failed.
#
# Asking npm (not git diff) means a publish blocked by failing tests is retried
# with "Run workflow" after the fix lands — no second bump needed.
#
# Job graph:
#
#   decide ─────────────────────────────┐
#   wait-tests (test.yml, same commit) ─┴─ build-templates ── publish-npm ── release
#
# build:templates runs exactly once per run; its tarballs travel between jobs
# as the "prebuilt" artifact.

on:
  push:
    branches: [main]
    paths:
      - "packages/bosia/package.json"
  workflow_dispatch:

# Serialize runs of this workflow so two pushes landing close together never
# create/clobber the same release assets concurrently.
# cancel-in-progress: false = queue, never cancel a publish in progress.
concurrency:
  group: prebuilt-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      published: ${{ steps.decide.outputs.published }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what to do
        id: decide
        run: |
          VERSION=$(jq -r '.version' packages/bosia/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Publish only a version npm doesn't have yet.
          if npm view "bosia@$VERSION" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

          # Prerelease → next, stable → latest.
          if [[ "$VERSION" =~ -(rc|beta|alpha) ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

  wait-tests:
    needs: decide
    if: needs.decide.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for test.yml on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # test.yml is started by the same push — give it a moment to register.
          for i in $(seq 1 12); do
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0].id // empty')
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "No test.yml run found for $SHA"
            exit 1
          fi
          echo "Waiting for test.yml run $RUN_ID"
          gh run watch "$RUN_ID" -R "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null

  build-templates:
    needs: wait-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # same Bun as local; bun.lock is tied to it

      - name: Build prebuilt template artifacts
        run: bun run build:templates
        working-directory: packages/bosia

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt
          path: packages/bosia/dist/prebuilt/*.tar.gz
          if-no-files-found: error

  publish-npm:
    needs: [decide, build-templates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        run: |
          echo "Publishing bosia@${{ needs.decide.outputs.version }} with tag ${{ needs.decide.outputs.tag }}"
          npm publish --tag "${{ needs.decide.outputs.tag }}" --access public
        working-directory: packages/bosia

  release:
    needs: [decide, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # gh release create needs the repo context

      - uses: actions/download-artifact@v8
        with:
          name: prebuilt
          path: prebuilt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.decide.outputs.version }}"
          ASSETS=(prebuilt/*.tar.gz)
          if [ "${{ needs.decide.outputs.tag }}" = "next" ]; then
            gh release create "$VERSION" --title "$VERSION" --generate-notes --prerelease "${ASSETS[@]}"
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes "${ASSETS[@]}"
          fi
